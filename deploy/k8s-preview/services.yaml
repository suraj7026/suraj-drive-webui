apiVersion: v1
kind: Service
metadata:
  name: surajdrive-frontend
spec:
  selector:
    app: drive-webui
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: drive-gateway
spec:
  selector:
    app: drive-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The existing Docker API remains on the main host. No new backend is started.
apiVersion: v1
kind: Service
metadata:
  name: surajdrive-backend
spec:
  ports:
    - name: http
      port: 4001
      targetPort: 4001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: surajdrive-backend-main
  labels:
    kubernetes.io/service-name: surajdrive-backend
    endpointslice.kubernetes.io/managed-by: migration-operator
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 4001
endpoints:
  - addresses: [192.168.1.37]
    conditions:
      ready: true
