apiVersion: v1
kind: Namespace
metadata:
  name: drive-web-preview
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-runtime
  namespace: drive-web-preview
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-deployer
  namespace: drive-web-preview
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-deployer
  namespace: drive-web-preview
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [drive-webui, drive-gateway]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-deployer
  namespace: drive-web-preview
subjects:
  - kind: ServiceAccount
    name: web-deployer
    namespace: drive-web-preview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-deployer
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: web-budget
  namespace: drive-web-preview
spec:
  hard:
    requests.cpu: 300m
    requests.memory: 512Mi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "4"
    persistentvolumeclaims: "0"
    services.nodeports: "0"
    services.loadbalancers: "0"
