services:
  drive-webui:
    image: ghcr.io/suraj7026/drive-webui:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: surajdrive-frontend
    pull_policy: always
    ports:
      - "4000:4000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NEXT_PUBLIC_API_URL=https://drive.sudarshanrajagopalan.one/drive-api
      - API_URL=http://surajdrive-backend:4001
      - BACKEND_URL=http://surajdrive-backend:4001
    restart: always
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0

networks:
  default:
    name: surajdrive_net
    external: true
