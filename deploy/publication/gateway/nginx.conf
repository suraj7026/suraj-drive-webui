server {
    listen 8080;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
    location / {
        proxy_pass http://surajdrive-frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /drive-api/ {
        proxy_pass http://surajdrive-backend:4001/;
        proxy_set_header Host drive.sudarshanrajagopalan.one;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
