map $cookie_drive_preview $drive_preview_enabled {
    default 0;
    ~^k8s-20b42a8$ 1;
}

map $drive_preview_enabled $drive_route {
    default docker;
    1 k8s-preview-20b42a8;
}

server {
    listen 80;
    add_header X-Drive-Route $drive_route always;
    error_page 418 = @drive_preview;

    location = /__migration-preview/enable {
        absolute_redirect off;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Set-Cookie "drive_preview=k8s-20b42a8; Path=/; Max-Age=1800; Secure; HttpOnly; SameSite=Lax";
        add_header Cache-Control "private, no-store" always;
        return 303 /login;
    }

    location = /__migration-preview/disable {
        absolute_redirect off;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Set-Cookie "drive_preview=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax";
        add_header Cache-Control "private, no-store" always;
        return 303 /login;
    }

    location = /__migration-preview/status {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/plain;
        add_header Cache-Control "private, no-store" always;
        add_header X-Drive-Route $drive_route always;
        return 200 "$drive_route\n";
    }

    location / {
        if ($drive_preview_enabled) { return 418; }
        proxy_pass http://surajdrive-frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /drive-api/ {
        if ($drive_preview_enabled) { return 418; }
        proxy_pass http://surajdrive-backend:4001/;
        proxy_set_header Host drive.sudarshanrajagopalan.one;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # A named location preserves the original method/body and /drive-api/ prefix.
    location @drive_preview {
        proxy_pass http://10.43.53.78:80;
        proxy_set_header Host drive.sudarshanrajagopalan.one;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Drive-Route;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        add_header X-Drive-Route k8s-preview-20b42a8 always;
    }
}
