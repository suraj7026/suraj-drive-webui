server {
    listen 80;

    # Retire the old opt-in controls without leaving stale routing cookies.
    location ~ ^/__migration-preview/(enable|disable)$ {
        absolute_redirect off;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Set-Cookie "drive_preview=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax";
        add_header Cache-Control "private, no-store" always;
        return 303 /login;
    }

    location = /__migration-preview/status {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/plain;
        add_header Cache-Control "private, no-store" always;
        add_header X-Drive-Route k8s-20b42a8 always;
        return 200 "k8s-20b42a8\n";
    }

    location / {
        proxy_pass http://10.43.53.78:80;
        proxy_set_header Host drive.sudarshanrajagopalan.one;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Drive-Route;
        add_header Cache-Control "private, no-store" always;
        add_header X-Drive-Route k8s-20b42a8 always;
    }
}
