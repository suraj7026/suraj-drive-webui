name: WebUI CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:4001 -t drive-webui:${GITHUB_SHA} .
