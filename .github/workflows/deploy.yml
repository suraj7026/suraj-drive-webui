name: Deploy WebUI
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/suraj7026/drive-webui:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://drive.sudarshanrajagopalan.one/drive-api

      - name: Local Deploy
        run: |
          mkdir -p ~/drive/web
          cd ~/drive/web

          cp "$GITHUB_WORKSPACE/deploy/docker-compose.yml" ./docker-compose.yml

          docker compose pull
          docker compose up -d
